<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#623C21">
<title>Pesaje de residuos sólidos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<style>
:root{
  --brown:#623C21; --green:#6ABF4B; --orange:#EC7700;
  --sand:#EFE1D4; --sand2:#E0C5AC; --taupe:#C39B82; --gray:#636569;
  --ink:#2B2118; --red:#B3261E; --red-bg:#FBE9E7; --ok:#2E7D32; --line:#D9C7B6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sand);color:var(--ink);font:15px/1.35 Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
.hidden{display:none!important}
#app{max-width:720px;margin:0 auto;padding:0 10px calc(90px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink)}

/* barra superior */
.bar{position:sticky;top:0;z-index:20;background:var(--brown);color:#fff;margin:0 -10px;padding:9px 12px;display:flex;align-items:center;gap:8px}
.bar h1{font-size:16px;margin:0;flex:1;line-height:1.15}
.bar .logo{height:36px;width:46px;object-fit:contain;background:#fff;border-radius:9px;padding:3px}
.bar small{display:block;font-weight:normal;opacity:.8;font-size:11.5px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid #fff;border-radius:999px;padding:3px 10px;background:transparent;color:#fff;font-size:12px;font-weight:bold}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block}
.chip.off i{background:#ff8a80}
.chip.q{background:var(--orange);border-color:var(--orange)}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs{border-bottom:1px solid var(--line);gap:0;margin:0 0 10px}
.tab{flex:1;padding:13px 6px 11px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--gray);font-weight:bold}
.tab.on{color:var(--brown);border-bottom-color:var(--brown);background:transparent}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.card h2{margin:0 0 8px;font-size:16px;color:var(--brown)}
label.f{display:block;font-weight:bold;font-size:13px;margin:10px 0 4px;color:var(--brown)}
.in{width:100%;border:2px solid var(--taupe);border-radius:10px;padding:11px 12px;background:#fff;min-height:48px}
.in:focus{outline:0;border-color:var(--green)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:84px;min-height:52px;border:2px solid var(--taupe);background:#fff;border-radius:12px;font-weight:bold;color:var(--brown)}
.seg button.on{background:var(--brown);border-color:var(--brown);color:#fff}
.btn{min-height:50px;border:0;border-radius:12px;padding:0 16px;font-weight:bold;background:#2A8035;color:#fff;width:100%}
.btn.sec{background:#fff;color:var(--brown);border:2px solid var(--brown)}
.btn.warn{background:var(--orange)}
.btn.sm{min-height:40px;width:auto;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5}
.err{color:var(--red);font-size:13px;margin-top:4px;font-weight:bold}
.muted{color:var(--gray);font-size:12.5px}

/* lista de hojas recientes */
.hrow{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;margin:6px 0;background:#fff;width:100%;text-align:left}
.hrow b{color:var(--brown)}
.xh{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:bold;color:#9a3412;background:#fff7ed}
.sinres{margin-top:8px;background:#FFF1E0;border:1px solid var(--orange);border-radius:10px;padding:8px 10px;font-size:13px}
.sinres label{display:flex;gap:8px;align-items:flex-start;font-weight:bold;color:#7a3d00}
.sinres input{width:22px;height:22px;flex:none}
.badge{font-size:11.5px;font-weight:bold;border-radius:999px;padding:2px 8px;background:var(--sand2);color:var(--brown);white-space:nowrap}
.badge.ok{background:#DDEFD5;color:var(--ok)} .badge.q{background:#FFE3C2;color:#9a4d00}

/* inicio: tablero y despachos */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--gray)}
.kpi .n{font-size:22px;font-weight:bold;color:var(--brown);margin-top:2px}
.kpi .n small{font-size:12.5px;font-weight:bold}
.kpi.warn .n{color:#8A4B00}
.homegrid{display:block}
.newcard{display:none}.newcard.open{display:block}
#b-new{margin-bottom:6px}
.dsec{font-size:14px;font-weight:bold;color:var(--brown);margin:14px 2px 6px}
.dcard{background:#fff;border:1px solid var(--line);border-radius:14px;margin:8px 0;overflow:hidden}
.dhead{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid #F0E6DB}
.dhead .t{flex:1;min-width:0}
.dhead .t b{font-size:16px;color:var(--ink)}
.dcard .hrow{border:0;border-radius:0;margin:0;border-bottom:1px solid #F5EDE4}
.hrow0{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid #F5EDE4}
.dfoot{padding:8px 10px;display:flex;gap:8px;justify-content:flex-end}
.bdg{font-size:11.5px;font-weight:bold;border-radius:999px;padding:3px 10px;white-space:nowrap;background:#E8E2DC;color:#4B4B4B;text-transform:capitalize}
.bdg.ab{background:#FFE3C2;color:#8A4B00}.bdg.ce{background:#DCE9F7;color:#1D4E89}.bdg.ap{background:#DDEFD5;color:#1E6B2E}.bdg.q{background:#E8E2DC;color:#4B4B4B}
@media(min-width:900px){
  #app{max-width:1180px}
  .homegrid{display:grid;grid-template-columns:400px 1fr;gap:22px;align-items:start}
  .newcard{display:block}#b-new{display:none}
  #v-hoja,#v-desp{max-width:780px;margin-left:auto;margin-right:auto}
  .tabs{max-width:780px}
}

/* hoja */
.hhead{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0}
.hhead .l1{font-weight:bold;color:var(--brown);font-size:16px}
.hhead .tot{font-size:24px;font-weight:bold;color:var(--brown)}
.warnbox{background:#FFF1E0;border:1px solid var(--orange);color:#7a3d00;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13px;font-weight:bold}
.search{margin:8px 0}
.cat{margin:12px 0 4px;font-weight:bold;color:#fff;background:var(--taupe);border-radius:10px 10px 0 0;padding:7px 12px;display:flex;justify-content:space-between}
.cat.pel{background:var(--red)}
.cat.rec{background:var(--green);color:#fff}
.blk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.bw{min-width:0;display:flex;flex-direction:column} .bw .bt{flex:1} .bw.open{grid-column:1/-1}
.bt{width:100%;border-radius:12px;padding:12px 11px;text-align:left;font-weight:bold;font-size:15px;min-height:66px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;border:2px solid rgba(0,0,0,.12)}
.bt small{font-weight:normal;font-size:11.5px;opacity:.92}
.bt .kgb{align-self:flex-start;background:rgba(255,255,255,.88);color:#333;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:bold}
.bw.open .bt{border-radius:12px 12px 0 0}
.bt.esp{border:2px dashed #8a8178;background:#fff!important;color:#333!important}
.bsub{font-size:12px;font-weight:bold;color:var(--gray);margin:8px 2px 3px;text-transform:uppercase}
.bw .rrow:last-child{border-radius:0 0 10px 10px}
.bempty{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:12px;color:var(--gray);font-size:13px}
.rrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-top:0;padding:11px 12px;min-height:56px}
.rrow:last-child{border-radius:0 0 10px 10px}
.rrow .n{flex:1}
.rrow .n small{display:block;color:var(--gray);font-size:11.5px}
.rrow .v{text-align:right;min-width:78px}
.rrow .v b{font-size:17px;color:var(--brown)}
.rrow .v small{display:block;color:var(--gray);font-size:11.5px}
.rrow.has{background:#F3FAEF;border-left:5px solid var(--green)}
.rrow.pend{background:#FFF4E5;border-left:5px solid var(--orange)}
.dock{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--brown);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:15}
.dock .btn{flex:1}

/* hoja inferior de pesadas */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(43,33,24,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--sand);width:100%;max-width:720px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:12px 12px calc(14px + env(safe-area-inset-bottom))}
.sh-head{display:flex;gap:10px;align-items:flex-start}
.sh-head .t{flex:1;font-weight:bold;color:var(--brown);font-size:17px}
.sh-head .t small{display:block;color:var(--gray);font-size:12px;font-weight:normal}
.sh-tot{background:#fff;border-radius:12px;padding:8px 12px;margin:8px 0;display:flex;justify-content:space-between;align-items:baseline}
.sh-tot b{font-size:26px;color:var(--brown)}
ol.pl{list-style:none;margin:0;padding:0}
ol.pl li{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:5px 0}
ol.pl li.ed{border-color:var(--orange);background:#FFF4E5}
ol.pl .k{flex:1}
ol.pl .k small{display:block;color:var(--gray);font-size:12px}
ol.pl .k.pd small{color:#9a4d00;font-weight:bold}
.ib{min-width:42px;min-height:42px;border:1px solid var(--taupe);background:#fff;border-radius:10px;font-size:16px}
.ib.back{padding:0 12px;font-size:13px;font-weight:bold;color:var(--brown,#623C21);white-space:nowrap}
.ib.del.ask{background:var(--red);color:#fff;border-color:var(--red);font-size:12px;font-weight:bold}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:46px;padding:0 14px;border:2px solid var(--taupe);background:#fff;border-radius:999px;font-weight:bold;color:var(--brown)}
.chips button.on{background:var(--brown);border-color:var(--brown);color:#fff}
.chips button.pend.on{background:var(--orange);border-color:var(--orange)}
.stick{position:sticky;bottom:-14px;background:#fff;padding:10px 0 4px;margin-top:6px}
.big{font-size:26px;font-weight:bold;text-align:center;min-height:58px}
.okbox{background:#DDEFD5;border:1px solid #b7dba8;color:var(--ok);border-radius:10px;padding:8px 10px;font-size:13.5px}
.row2{display:flex;gap:8px}
.row2>*{flex:1}
.prev{margin:8px 0;padding:8px 12px;border-radius:10px;background:#fff;border:1px dashed var(--taupe);text-align:center;font-size:17px;color:var(--brown);font-weight:bold;min-height:42px}
.prev.bad{color:var(--red);border-color:var(--red)}

/* despacho */
table.d{width:100%;border-collapse:collapse;background:#fff;font-size:13.5px}
table.d th,table.d td{border:1px solid var(--line);padding:6px 6px}
table.d th{background:var(--sand2);color:var(--brown);text-align:center}
table.d td.num{text-align:right;white-space:nowrap}
table.d tr.catr td{background:var(--taupe);color:#fff;font-weight:bold}
table.d tr.catr.pel td{background:var(--red)}
table.d tfoot td{font-weight:bold;background:var(--sand)}
.st{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.st span{padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:bold;background:#fff;border:1px solid var(--line)}
.st .ok{background:#DDEFD5;color:var(--ok);border-color:#b7dba8}
.st .ab{background:#FFE3C2;color:#9a4d00;border-color:#f3c288}
.st .no{background:var(--red-bg);color:var(--red);border-color:#f0b8b2}
#print-head{display:none}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;text-align:center}
.toast.on{opacity:1}

.off{display:none}
@media print{
  @page{size:A4 portrait;margin:8mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;color:#000;font-size:8pt}
  .bar,.tabs,.dock,.noprint,#v-home,#v-hoja,.toast,.screen-only{display:none!important}
  #app{max-width:none;padding:0}
  #v-desp{display:block!important}
  .off{display:block}
  .off.noap table{display:none!important}
  .off.noap::before{content:"Despacho sin aprobar: no se puede imprimir.";display:block;font-size:12pt;padding:20px}
  .off table{border-collapse:collapse;width:100%}
  .off td,.off th{border:1px solid #000;padding:2px 4px;font-size:7.5pt;line-height:1.25;color:#000}
  .off th{background:#fff;font-weight:bold;text-align:center}
  .off .c{text-align:center;width:19%}
  .off .r{text-align:right}
  .off .ohead .tit{text-align:center;font-weight:bold;font-size:10.5pt}
  .off .og{margin-top:6px}
  .off .og td{border:0;padding:3px 2px;font-size:8pt;width:33%}
  .off .osec{font-weight:bold;font-size:8pt;margin:8px 0 3px}
  .off .ocols{display:flex;gap:8px;align-items:flex-start}
  .off .ocols>div{flex:1}
  .off .oh th{background:#fff}
  .off .obs{border:1px solid #000;margin-top:8px;padding:4px 5px;min-height:46px;font-size:8pt}
  .off .osign{margin-top:10px}
}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <img class="logo" src="img/logo.png" alt="">
    <h1>Pesaje de residuos sólidos<small id="sub"></small></h1>
    <button class="chip q hidden" id="chip-q"></button>
    <span class="chip" id="chip-net"><i></i><span>Con conexión</span></span>
  </div>

  <div class="tabs noprint">
    <button class="tab on" data-tab="hoja">Pesaje</button>
    <button class="tab" data-tab="desp">Despacho (SGA.R.G.001)</button>
  </div>

  <!-- INICIO: tablero, nueva hoja y despachos -->
  <section id="v-home">
    <div class="kpis" id="kpis"></div>
    <div class="homegrid">
      <div>
        <button class="btn" id="b-new">+ Nueva hoja de pesaje</button>
        <div class="card newcard" id="n-card">
          <h2>Nueva hoja de pesaje</h2>
          <label class="f">Puerta</label>
          <div class="seg" id="n-puerta"></div>
          <label class="f" for="n-fecha">Fecha</label>
          <input id="n-fecha" type="date" class="in">
          <label class="f" for="n-placa">Placa del vehículo de despacho</label>
          <input id="n-placa" class="in" list="dl-placas" autocapitalize="characters" autocomplete="off" placeholder="Ej.: ABZ-937">
          <datalist id="dl-placas"></datalist>
          <datalist id="dl-placas-d"></datalist>
          <label class="f" for="n-resp">Responsable del registro</label>
          <input id="n-resp" class="in" autocomplete="off" placeholder="Nombre y apellido">
          <div class="err" id="n-err"></div>
          <div style="height:10px"></div>
          <button class="btn" id="n-go">Empezar a pesar</button>
        </div>
      </div>
      <div>
        <div id="h-list"></div>
      </div>
    </div>
  </section>

  <!-- HOJA ABIERTA -->
  <section id="v-hoja" class="hidden">
    <div class="hhead">
      <div class="l1" id="hh-l1"></div>
      <div class="muted" id="hh-l2"></div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:4px">
        <div><div class="muted">Total neto de la hoja</div><div class="tot"><span id="hh-kg">0</span> kg</div></div>
        <div class="muted" id="hh-un" style="text-align:right"></div>
      </div>
      <div class="warnbox hidden" id="hh-warn"></div>
    </div>
    <input id="q" class="in search" placeholder="Buscar residuo (ej.: cartón, chocolate)…" autocomplete="off">
    <div id="lista"></div>
  </section>

  <!-- DESPACHO -->
  <section id="v-desp" class="hidden">
    <div class="card noprint">
      <h2>Consolidado por despacho</h2>
      <div class="muted">Suma automática de las hojas de todas las puertas con la misma fecha y placa. Reemplaza el segundo registro manual.</div>
      <div class="row2">
        <div><label class="f" for="d-fecha">Fecha</label><input id="d-fecha" type="date" class="in"></div>
        <div><label class="f" for="d-placa">Placa</label><input id="d-placa" class="in" list="dl-placas-d" autocapitalize="characters" autocomplete="off"></div>
      </div>
      <div style="height:10px"></div>
      <button class="btn" id="d-go">Consultar</button>
      <div class="err" id="d-err"></div>
    </div>
    <div id="d-out"></div>
  </section>
</div>

<div class="dock hidden" id="dock">
  <button class="btn sec" id="b-back">← Hojas</button>
  <button class="btn" id="b-close">Cerrar hoja y enviar</button>
</div>

<!-- Pesadas de un residuo -->
<div class="sheet hidden" id="sheet">
  <div class="sheet-in">
    <div class="sh-head">
      <div class="t"><span id="sh-name"></span><small id="sh-sap"></small></div>
      <button class="ib back" id="sh-x" aria-label="Volver a la lista">↩ Volver a la lista</button>
    </div>
    <div class="sh-tot"><span>Total de este residuo</span><span><b id="sh-kg">0</b> kg <span class="muted" id="sh-un"></span></span></div>
    <ol class="pl" id="sh-list"></ol>
    <div class="card" style="margin-bottom:0">
      <h2 id="f-title">Nueva pesada</h2>
      <label class="f" for="f-bruto">Peso bruto (kg)</label>
      <input id="f-bruto" class="in big" inputmode="decimal" autocomplete="off" placeholder="0.0">
      <label class="f">Tara del coche (kg)</label>
      <div class="chips" id="f-taras"></div>
      <div style="height:6px"></div>
      <input id="f-otra" class="in" inputmode="decimal" autocomplete="off" placeholder="Otra tara (kg)">
      <label class="f">Cantidad (opcional)</label>
      <div class="row2">
        <input id="f-uni" class="in" inputmode="numeric" autocomplete="off" placeholder="Ej.: 3">
        <select id="f-tu" class="in"></select>
      </div>
      <div class="prev" id="f-prev">—</div>
      <div class="err" id="f-err"></div>
      <div class="stick">
        <div class="row2">
          <button class="btn sec hidden" id="f-cancel">Cancelar edición</button>
          <button class="btn" id="f-add">Agregar pesada</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
"use strict";
const CFG = Object.assign({SCRIPT_URL:"",CLAVE:"",ZONA_HORARIA:"America/Lima",PLANTA:"",PUERTAS:[],PLACAS:[],TARAS_INICIALES:[],UNIDADES:[["B","Bolsas"]],TIPOS_MANEJO:[],CATALOGO:[]}, window.APP_CONFIG||{});
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n=>Math.round((n+Number.EPSILON)*100)/100;
const fmt = n=>Number(n).toLocaleString("es-PE",{minimumFractionDigits:0,maximumFractionDigits:2});
const num = s=>{ const v=parseFloat(String(s).trim().replace(",",".")); return isFinite(v)?v:NaN; };
const uuid = ()=> (crypto.randomUUID?crypto.randomUUID():"id-"+Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const normPlaca = s=>String(s||"").toUpperCase().replace(/[\s]/g,"");
const fold = s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();

/* ---------- fecha de Lima ---------- */
function todayStr(){
  const f=new Intl.DateTimeFormat("en-CA",{timeZone:CFG.ZONA_HORARIA,year:"numeric",month:"2-digit",day:"2-digit"});
  return f.format(new Date());
}
const fechaCorta = s=>{ const [y,m,d]=String(s).split("-"); return `${d}/${m}/${y}`; };

/* ---------- catálogo plano ---------- */
let CAT = [], CATBY = new Map();
function setCat(lista){   // lista: [{name,cat,cod}]
  CAT = lista.map(r=>({cat:r.cat,pel:r.cat==="Peligrosos",cod:r.cod||"",name:r.name,key:r.cod?String(r.cod):"n:"+fold(r.name)}));
  CATBY = new Map(CAT.map(x=>[x.key,x]));
}
const CAT_CONFIG=[]; CFG.CATALOGO.forEach(g=>g.items.forEach(([cod,name])=>CAT_CONFIG.push({cat:g.cat,cod,name})));
const CATK="pesaje.catalogo";

/* ---------- almacenamiento local ---------- */
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

let MEM = new Map();    // respaldo si IndexedDB no está disponible
const DB = {
  _db:null,
  open(){ return this._db?Promise.resolve(this._db):new Promise((res,rej)=>{
    if(!window.indexedDB) return rej(new Error("sin idb"));
    const r=indexedDB.open("pesaje-residuos",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("hojas",{keyPath:"id"});
    r.onsuccess=()=>{ this._db=r.result; res(r.result); }; r.onerror=()=>rej(r.error); }); },
  async tx(mode,fn){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction("hojas",mode); const rq=fn(t.objectStore("hojas")); t.oncomplete=()=>res(rq&&rq.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); },
  async all(){ try{ return (await this.tx("readonly",s=>s.getAll()))||[]; }catch(e){ return Array.from(MEM.values()); } },
  async put(h){ MEM.set(h.id,h); try{ await this.tx("readwrite",s=>s.put(h)); }catch(e){} },
  async del(id){ MEM.delete(id); try{ await this.tx("readwrite",s=>s.delete(id)); }catch(e){} }
};

/* ---------- modelo ---------- */
let HOJAS = [];      // todas las hojas locales
let H = null;        // hoja abierta
const netoDe = p => p.taraPend ? p.bruto : r2(p.bruto-(p.tara||0));
function totales(h,key){
  const o={kg:0,n:0,uni:{},pend:0};
  (h.pesadas||[]).forEach(p=>{ if(p.key!==key) return; o.n++; o.kg=r2(o.kg+netoDe(p)); if(p.taraPend) o.pend++;
    if(p.uni) o.uni[p.tu||"UD"]=(o.uni[p.tu||"UD"]||0)+p.uni; });
  return o;
}
const uniTxt = u=>Object.keys(u).map(k=>`${fmt(u[k])} ${k}`).join(" · ");
const kgHoja = h=>r2((h.pesadas||[]).reduce((a,p)=>a+netoDe(p),0));
const pendHoja = h=>(h.pesadas||[]).filter(p=>p.taraPend).length;
// una hoja vacía que nunca se envió no se manda al Sheet (así no queda como "abierta" bloqueando la aprobación)
const dirty = h=>(h.rev||0)>(h.sync||0) && !((h.pesadas||[]).length===0 && !h.sync);
/* despachos aprobados: sus hojas quedan solo de lectura */
const APRK="pesaje.aprob";
const aprobada = h=>!!LS.get(APRK,{})[h.fecha+"|"+normPlaca(h.placa)];
function marcaAprob(f,p,v){ const m=LS.get(APRK,{}), k=f+"|"+normPlaca(p); if(v) m[k]=1; else delete m[k]; LS.set(APRK,m); }
async function refrescaAprob(h){
  if(!CFG.SCRIPT_URL||!navigator.onLine) return;
  try{
    const r=await fetchT(`${CFG.SCRIPT_URL}?action=despacho&sede=${encodeURIComponent(CFG.PLANTA)}&fecha=${encodeURIComponent(h.fecha)}&placa=${encodeURIComponent(normPlaca(h.placa))}&key=${encodeURIComponent(CFG.CLAVE)}`,{redirect:"follow"},15000);
    const j=await r.json();
    if(j&&j.ok) marcaAprob(h.fecha,h.placa,!!(j.despacho&&j.despacho.estado==="Aprobado"));
  }catch(e){}
}

async function saveHoja(h){ h.rev=(h.rev||0)+1; h.act=Date.now(); await DB.put(h); drawQueue(); sync(); }

/* ---------- sincronización con Google Sheets ---------- */
const ACS=new Set();   // envíos en curso: se cancelan si se pierde la señal
async function fetchT(url,opt={},ms=30000){
  const ac=new AbortController(); ACS.add(ac); const t=setTimeout(()=>ac.abort(),ms);
  try{ return await fetch(url,Object.assign({signal:ac.signal},opt)); } finally{ clearTimeout(t); ACS.delete(ac); }
}
function payloadDe(h){
  return { key:CFG.CLAVE, action:"hoja", id:h.id, sede:CFG.PLANTA, planta:CFG.PLANTA, puerta:h.puerta, fecha:h.fecha, placa:h.placa, responsable:h.responsable, estado:h.estado,
    pesadas:(h.pesadas||[]).map((p,i)=>({n:i+1,cod:p.cod,res:p.res,cat:p.cat,bruto:p.bruto,tara:p.taraPend?"":(p.tara||0),taraPend:!!p.taraPend,neto:netoDe(p),uni:p.uni||"",tu:p.uni?(p.tu||"UD"):"",ts:p.ts})) };
}
let syncing=null, lastErr="";
const DESPQ="pesaje.despq";    // despachos con datos por enviar: {clave: payload}
async function postJ(obj,ms=60000){
  const r=await fetchT(CFG.SCRIPT_URL,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(obj)},ms);
  return r.json();
}
async function syncRun(){
  if(!CFG.SCRIPT_URL || !navigator.onLine) return;
  lastErr="";
  for(const h of HOJAS.filter(dirty).sort((a,b)=>(a.act||0)-(b.act||0))){
    const sent=h.rev; let j;
    try{ j=await postJ(payloadDe(h)); }catch(e){ return; }          // sin señal: se reintenta luego
    if(j&&j.ok){ h.sync=Math.max(h.sync||0,sent); await DB.put(h); }
    else if(j&&j.error==="aprobado"){ h.sync=Math.max(h.sync||0,sent); h.rechazado=true; await DB.put(h); marcaAprob(h.fecha,h.placa,true); lastErr="aprobado"; }   // ya aprobado: no se acepta el cambio
    else { lastErr=(j&&j.error)||"error"; return; }
  }
  const q=LS.get(DESPQ,{});
  for(const k of Object.keys(q)){
    let j; try{ j=await postJ(q[k]); }catch(e){ return; }
    if(j&&(j.ok||j.error==="aprobado")){
      const q2=LS.get(DESPQ,{}); if(JSON.stringify(q2[k])===JSON.stringify(q[k])) delete q2[k]; LS.set(DESPQ,q2);
      if(j.error==="aprobado") lastErr="aprobado";
    } else { lastErr=(j&&j.error)||"error"; return; }
  }
}
function sync(){
  if(syncing) return syncing;
  syncing=syncRun().catch(()=>{}).then(()=>{ syncing=null; drawQueue(); drawHojas();
    if(lastErr==="clave") toast("La clave no coincide con la de la hoja de Google.");
    if(lastErr==="aprobado") toast("Ese despacho ya fue aprobado: el cambio no se envió. Pide que lo reabran.");
  });
  return syncing;
}
function drawQueue(){
  const n=HOJAS.filter(dirty).length+Object.keys(LS.get(DESPQ,{})).length, c=$("#chip-q");
  const show = CFG.SCRIPT_URL && n;
  c.classList.toggle("hidden",!show);
  c.textContent = show?`⏳ ${n} por enviar`:"";
}

function openNew(v){ $("#n-card").classList.toggle("open",v===undefined?!$("#n-card").classList.contains("open"):!!v); }
function drawHojas(){
  const hoy=todayStr(), G=new Map();
  HOJAS.forEach(h=>{ const pl=normPlaca(h.placa), k=h.fecha+"|"+pl; if(!G.has(k)) G.set(k,{fecha:h.fecha,placa:pl,hojas:[],ts:0}); const g=G.get(k); g.hojas.push(h); g.ts=Math.max(g.ts,h.creado||0); });
  const all=[...G.values()];
  const kgHoy=r2(HOJAS.filter(h=>h.fecha===hoy).reduce((a,h)=>a+kgHoja(h),0));
  const porAprobar=all.filter(g=>!aprobada(g.hojas[0])&&g.hojas.some(h=>(h.pesadas||[]).length)&&g.hojas.every(h=>h.estado==="cerrada")).length;
  const abiertas=HOJAS.filter(h=>h.estado!=="cerrada"&&!aprobada(h)).length;
  $("#kpis").innerHTML=`<div class="kpi"><div class="l">Pesado hoy</div><div class="n">${fmt(kgHoy)} <small>kg</small></div></div>
    <div class="kpi ${porAprobar?"warn":""}"><div class="l">Por aprobar</div><div class="n">${porAprobar} <small>despacho${porAprobar===1?"":"s"}</small></div></div>
    <div class="kpi"><div class="l">Hojas abiertas</div><div class="n">${abiertas}</div></div>`;
  const card=g=>{
    const ap=aprobada(g.hojas[0]), todasCerr=g.hojas.every(h=>h.estado==="cerrada");
    const est=ap?`<span class="bdg ap">🔒 aprobado</span>`:todasCerr?`<span class="bdg ce">listo para aprobar</span>`:`<span class="bdg ab">en curso</span>`;
    const kg=r2(g.hojas.reduce((a,h)=>a+kgHoja(h),0));
    const puertas=CFG.PUERTAS.concat(g.hojas.map(h=>h.puerta).filter(p=>!CFG.PUERTAS.includes(p)));
    const filas=puertas.map(p=>{
      const hs=g.hojas.filter(h=>h.puerta===p);
      if(!hs.length) return `<div class="hrow0"><b style="width:64px">${esc(p)}</b><span class="muted" style="flex:1">Sin hoja</span>${ap?"":`<button class="btn sm sec" data-newp="${esc(p)}|${g.fecha}|${esc(g.placa)}">+ Crear hoja</button>`}</div>`;
      return hs.map(h=>`<button class="hrow" data-open="${h.id}">
        <div style="flex:1"><b>${esc(h.puerta)}</b><div class="muted">${esc(h.responsable)} · ${fmt(kgHoja(h))} kg · ${(h.pesadas||[]).length} pesada${(h.pesadas||[]).length===1?"":"s"}</div></div>
        ${dirty(h)&&CFG.SCRIPT_URL?'<span class="bdg q">por enviar</span>':''}
        ${(h.pesadas||[]).length===0&&(aprobada(h)||!h.sync)?`<span class="xh" data-delh="${h.id}">✕ quitar</span>`:""}
        ${aprobada(h)?'<span class="bdg ap">🔒 aprobada</span>':`<span class="bdg ${h.estado==="cerrada"?"ce":"ab"}">${h.estado==="cerrada"?"cerrada":"abierta"}</span>`}
      </button>`).join("");
    }).join("");
    return `<div class="dcard"><div class="dhead"><div class="t"><b>${esc(g.placa)}</b><div class="muted">${fechaCorta(g.fecha)} · ${fmt(kg)} kg en total</div></div>${est}</div>${filas}
      <div class="dfoot"><button class="btn sm" data-gdesp="${g.fecha}|${esc(g.placa)}">Ver despacho</button></div></div>`;
  };
  const ord=all.sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.ts-a.ts);
  const hoyG=ord.filter(g=>g.fecha===hoy), antG=ord.filter(g=>g.fecha!==hoy).slice(0,12);
  $("#h-list").innerHTML = ord.length
    ? (hoyG.length?`<div class="dsec" style="margin-top:2px">Despachos de hoy</div>`+hoyG.map(card).join(""):"")
      +(antG.length?`<div class="dsec">Días anteriores</div>`+antG.map(card).join(""):"")
    : `<div class="card muted">Aún no hay hojas en este equipo. Toca “Nueva hoja de pesaje” para empezar.</div>`;
  drawQueue();
}
async function startHoja(){
  const puerta=selPuerta, fecha=$("#n-fecha").value, placa=normPlaca($("#n-placa").value), resp=$("#n-resp").value.trim().replace(/\s+/g," ");
  const e=$("#n-err"); e.textContent="";
  if(!puerta) return void(e.textContent="Elige la puerta.");
  if(!fecha) return void(e.textContent="Elige la fecha.");
  if(fecha>todayStr()) return void(e.textContent="La fecha no puede ser futura.");
  if(placa.length<5) return void(e.textContent="Escribe la placa del vehículo.");
  if(resp.split(" ").length<2) return void(e.textContent="Escribe nombre y apellido del responsable.");
  LS.set("pesaje.puerta",puerta); LS.set("pesaje.resp",resp); LS.set("pesaje.placa",placa);
  const ex=HOJAS.find(h=>h.puerta===puerta&&h.fecha===fecha&&h.placa===placa);
  if(!ex){
    await refrescaAprob({fecha,placa});     // consulta al servidor si hay señal
    if(aprobada({fecha,placa})) return void(e.textContent="El despacho de "+placa+" del "+fechaCorta(fecha)+" ya fue aprobado: no se pueden crear hojas nuevas. Si falta pesar algo, pide que reabran el despacho.");
  }
  if(ex){ toast("Ya existía esa hoja: se abrió para continuar."); return openHoja(ex.id); }
  const h={id:uuid(),puerta,fecha,placa,responsable:resp,estado:"abierta",pesadas:[],creado:Date.now(),rev:0,sync:0};
  HOJAS.push(h); await saveHoja(h); openNew(false); openHoja(h.id);
}
function openHoja(id){
  H=HOJAS.find(h=>h.id===id); if(!H) return;
  TAB="hoja"; $("#q").value=""; drawHoja(); showView();
  refrescaAprob(H).then(()=>{ if(H&&H.id===id){ drawHoja(); drawHojas(); } });
}

/* ---------- hoja ---------- */
function drawHoja(){
  const ap = aprobada(H), ro = H.estado==="cerrada"||ap;
  $("#hh-l1").textContent=`${H.puerta} · ${fechaCorta(H.fecha)} · ${H.placa}`;
  $("#hh-l2").textContent=`Responsable: ${H.responsable}${ap?" · 🔒 despacho aprobado":H.estado==="cerrada"?" · hoja cerrada":""}`;
  $("#hh-kg").textContent=fmt(kgHoja(H));
  const u={}; H.pesadas.forEach(p=>{ if(p.uni) u[p.tu||"UD"]=(u[p.tu||"UD"]||0)+p.uni; });
  $("#hh-un").textContent=uniTxt(u);
  const pend=pendHoja(H), w=$("#hh-warn");
  const aviso = ap ? (H.rechazado?"🔒 Despacho aprobado: ya no se puede editar. Los últimos cambios hechos en este equipo NO se guardaron en el Registro. Pide que reabran el despacho.":"🔒 Despacho aprobado: solo lectura. Para corregir, el inspector debe reabrir el despacho.")
                   : pend?`⚠ ${pend} pesada${pend>1?"s":""} con tara pendiente: el peso es bruto hasta que la completes.`:"";
  w.classList.toggle("hidden",!aviso); w.textContent=aviso;
  const q=fold($("#q").value.trim());
  const match=x=>!q || fold(x.name+" "+x.cod+" "+x.cat).includes(q);
  const row=x=>{
    const t=totales(H,x.key);
    return `<button class="rrow ${t.pend?"pend":t.n?"has":""}" data-k="${esc(x.key)}">
      <div class="n">${esc(x.name)}<small>${x.pel?"⚠ peligroso · ":""}${x.cod?"SAP "+x.cod:"sin código SAP"}</small></div>
      <div class="v">${t.n?`<b>${fmt(t.kg)}</b> kg<small>${t.n} pesada${t.n>1?"s":""}${uniTxt(t.uni)?" · "+uniTxt(t.uni):""}</small>`:`<span class="muted">+ pesar</span>`}</div></button>`;
  };
  // residuos ya pesados en esta hoja: arriba, el último pesado primero
  const last=new Map();
  H.pesadas.forEach(p=>last.set(p.key,Math.max(last.get(p.key)||0,p.ts||0)));
  const pinned=CAT.filter(x=>last.has(x.key)&&match(x)).sort((a,b)=>last.get(b.key)-last.get(a.key));
  let html="";
  if(pinned.length) html+=`<div class="cat rec"><span>Pesados en esta hoja</span><span>último primero</span></div>`+pinned.map(row).join("");
  const rest=CAT.filter(x=>!last.has(x.key)&&match(x));
  const bl=BLOQUES.map(b=>({b,items:rest.filter(x=>b.cats.includes(x.cat)),todos:CAT.filter(x=>b.cats.includes(x.cat))}));
  const kgBloque=b=>r2(CAT.filter(x=>b.cats.includes(x.cat)).reduce((a,x)=>a+totales(H,x.key).kg,0));
  html+=`<div class="blk">`+bl.filter(o=>!q||o.items.length).map(o=>{
    const b=o.b, abre=q?true:OPENB===b.id, kg=kgBloque(b);
    const st=`background:${b.bg};color:${b.fg};${b.bd?"border-color:"+b.bd+";":""}`;
    let cuerpo="";
    if(abre){
      if(!o.items.length) cuerpo=`<div class="bempty">Sin residuos aún. El administrador puede agregarlos en la pestaña Catálogo.</div>`;
      else if(b.cats.length>1) cuerpo=b.cats.map(c=>{ const it=o.items.filter(x=>x.cat===c); return it.length?`<div class="bsub">${esc(c)}</div>`+it.map(row).join(""):""; }).join("");
      else cuerpo=o.items.map(row).join("");
    }
    return `<div class="bw ${abre?"open":""}"><button class="bt ${b.esp?"esp":""}" data-b="${b.id}" style="${st}"><span>${esc(b.t)}</span><small>${o.todos.length?o.todos.length+" residuo"+(o.todos.length>1?"s":""):"sin residuos"} · NTP ${esc(b.ntp)}</small>${kg?`<span class="kgb">${fmt(kg)} kg</span>`:""}</button>${cuerpo}</div>`;
  }).join("")+`</div>`;
  $("#lista").innerHTML = html || `<div class="card muted">Sin coincidencias.</div>`;
  const b=$("#b-close"); b.textContent = H.estado==="cerrada"?"Reabrir hoja":"Cerrar hoja y enviar"; b.classList.toggle("warn",H.estado==="cerrada"); b.classList.toggle("hidden",ap);
}

async function cerrarOReabrir(){
  if(aprobada(H)) return toast("Despacho aprobado: ya no se puede editar.");
  if(H.estado==="cerrada"){ H.estado="abierta"; await saveHoja(H); drawHoja(); return toast("Hoja reabierta."); }
  if(!H.pesadas.length) return toast("La hoja no tiene pesadas.");
  const pend=pendHoja(H);
  if(pend) return toast(`Completa la tara de ${pend} pesada${pend>1?"s":""} antes de cerrar.`);
  H.estado="cerrada"; await saveHoja(H); drawHoja();
  toast(CFG.SCRIPT_URL?(navigator.onLine?"Hoja cerrada. Enviando…":"Hoja cerrada. Se enviará cuando haya señal."):"Hoja cerrada (modo local: falta conectar la hoja de Google).");
}

/* ---------- despacho consolidado ---------- */
function buildDespacho(hojas){
  const porPuerta=CFG.PUERTAS.slice(), map=new Map();
  hojas.forEach(h=>(h.pesadas||[]).forEach(p=>{
    const k=p.cod?p.cod:"n:"+fold(p.res);
    if(!map.has(k)) map.set(k,{key:k,cod:p.cod||"",res:p.res,cat:p.cat,pp:{},uni:{},pend:0});
    const r=map.get(k), n=p.neto!=null&&p.neto!==""?Number(p.neto):netoDe(p);
    r.pp[h.puerta]=r2((r.pp[h.puerta]||0)+n);
    if(p.uni) r.uni[p.tu||"UD"]=(r.uni[p.tu||"UD"]||0)+Number(p.uni);
    if(p.taraPend===true||p.taraPend==="TRUE"||p.taraPend==="true") r.pend++;
  }));
  const order=new Map(CAT.map((x,i)=>[x.key,i]));
  const filas=Array.from(map.values()).sort((a,b)=>(order.has(a.key)?order.get(a.key):999)-(order.has(b.key)?order.get(b.key):999));
  filas.forEach(r=>r.total=r2(Object.values(r.pp).reduce((a,b)=>a+b,0)));
  return {porPuerta,filas};
}
async function consultarDespacho(){
  const fecha=$("#d-fecha").value, placa=normPlaca($("#d-placa").value), e=$("#d-err"); e.textContent="";
  if(!fecha||placa.length<5) return void(e.textContent="Elige la fecha y escribe la placa.");
  let hojas=[], origen="Solo hojas de este equipo"; DSRV=null;
  if(CFG.SCRIPT_URL && navigator.onLine){
    try{
      const r=await fetchT(`${CFG.SCRIPT_URL}?action=despacho&sede=${encodeURIComponent(CFG.PLANTA)}&fecha=${encodeURIComponent(fecha)}&placa=${encodeURIComponent(placa)}&key=${encodeURIComponent(CFG.CLAVE)}`,{redirect:"follow"},25000);
      const j=await r.json();
      if(j&&j.ok){ hojas=j.hojas||[]; DSRV=j.despacho||null; marcaAprob(fecha,placa,!!(DSRV&&DSRV.estado==="Aprobado")); origen="Hojas de todas las puertas (Google Sheets)"; }
      else e.textContent="No se pudo consultar la hoja de Google ("+((j&&j.error)||"error")+"). Se muestran solo las de este equipo.";
    }catch(x){ e.textContent="Sin conexión con la hoja de Google. Se muestran solo las de este equipo."; }
  }
  // las hojas locales (más recientes) reemplazan a las del servidor con el mismo id
  const loc=HOJAS.filter(h=>h.fecha===fecha&&normPlaca(h.placa)===placa);
  const ids=new Set(loc.map(h=>h.id));
  hojas=hojas.filter(h=>!ids.has(h.id)).concat(loc);
  drawDespacho(fecha,placa,hojas,origen);
}

function cargarDesp(fecha,placa,srv){

  if(k!==DKEY||aprob){

    Object.keys(DESP).forEach(x=>DESP[x]=s[x]||"");

    <div id="a-box" class="hidden" data-modo="${ap?"reabrir":"aprobar"}">
      ${ap||!FALTAN.length?"":`<div class="sinres"><label><input type="checkbox" id="a-sinres"><span>Confirmo que en ${FALTAN.map(esc).join(" y ")} no hubo residuos para este camión.</span></label><div class="muted" style="margin-top:4px">Si sí hubo, no marques esto: primero crea y cierra la hoja de esa puerta.</div></div>`}
      ${ap?"":`<label class="f" for="a-nom">Nombre de quien aprueba</label><input id="a-nom" class="in" autocomplete="off" value="${esc(LS.get("pesaje.aprobador",""))}">`}
      <label class="f" for="a-clave">Clave de aprobación</label><input id="a-clave" class="in" type="password" autocomplete="off">
      <div class="row2" style="margin-top:8px"><button class="btn sec" id="a-cancel">Cancelar</button><button class="btn" id="a-ok">${ap?"Reabrir":"Aprobar"}</button></div>
      <div id="a-err" class="warnbox hidden"></div>
    </div></div>`;
}
const ERR_APR={clave_aprobar:"La clave de aprobación no es correcta.",sin_datos_despacho:"Faltan los datos del despacho (empresa y tipo de manejo).",ya_aprobado:"Este despacho ya estaba aprobado.",sin_pesadas:"No hay pesadas para aprobar.",clave:"La clave de la hoja de Google no coincide.",aprobado:"Este despacho ya está aprobado."};
async function aprobarDesp(){
  const box=$("#a-box"), modo=box.dataset.modo, e=$("#a-err");
  const err=m=>{ e.textContent=m; e.classList.remove("hidden"); };
  e.classList.add("hidden");
  const nombre=modo==="aprobar"?$("#a-nom").value.trim():"", clave=$("#a-clave").value;
  if(modo==="aprobar"&&!nombre) return err("Escribe el nombre de quien aprueba.");
  if(!clave) return err("Escribe la clave de aprobación.");
  if(!navigator.onLine) return err("Se necesita conexión para esto.");
  const [fecha,placa]=DKEY.split("|");
  if(modo==="aprobar"){
    const ab=DHOJAS.filter(h=>h.estado!=="cerrada").map(h=>h.puerta);
    if(ab.length) return err("Hay hojas abiertas ("+ab.join(", ")+"). Ciérralas antes de aprobar.");
    const pend=DFILAS.reduce((a,r)=>a+r.pend,0);
    if(pend) return err("Hay "+pend+" pesada"+(pend>1?"s":"")+" con tara pendiente. Complétalas antes de aprobar.");
    if(FALTAN.length){
      if(!$("#a-sinres").checked) return err("Faltan hojas en: "+FALTAN.join(", ")+". Crea la hoja o marca la confirmación de que no hubo residuos.");
      const nota="Sin residuos en: "+FALTAN.join(", ")+" (confirmado por "+nombre+").";
      DESP.obs=(DESP.obs||"").replace(/\n?Sin residuos en: [^\n]*/g,"").trim(); DESP.obs=(DESP.obs?DESP.obs+"\n":"")+nota;
      const po=$("#p-obs"); if(po) po.value=DESP.obs; const ho=$("#ph-obs"); if(ho) ho.textContent=DESP.obs; despChanged();
    }
    if(!DESP.op.trim()) return err("Falta la empresa operadora.");
    if(HN&&!DESP.man) return err("Falta el tipo de manejo"+(HP?" (no peligrosos)":"")+".");
    if(HP&&!DESP.manP) return err("Falta el tipo de manejo (peligrosos).");
  }
  const bt=$("#a-ok"); bt.disabled=true; bt.textContent="Enviando…";
  try{
    await sync(); await sync();      // primero se sube todo lo pendiente
    const pendLocal=HOJAS.some(h=>h.fecha===fecha&&normPlaca(h.placa)===placa&&dirty(h))||LS.get(DESPQ,{})[DKEY];
    if(pendLocal) return err("Hay datos por enviar. Revisa la conexión e inténtalo de nuevo.");
    const j=await postJ({key:CFG.CLAVE,action:modo,sede:CFG.PLANTA,fecha,placa,claveAprobar:clave,aprobador:nombre},60000);
    if(j&&j.ok){
      if(modo==="aprobar") LS.set("pesaje.aprobador",nombre);
      toast(modo==="aprobar"?"Despacho aprobado: ya está en el Registro Interno.":"Despacho reabierto.");
      if(j.aviso) alert(j.aviso);
      return consultarDespacho();
    }
    if(j&&j.error==="faltan") return err("Falta: "+(j.faltan||[]).join(", ")+".");
    if(j&&j.error==="residuo_sin_columna") return err("Estos residuos no tienen columna en el Registro Interno: "+(j.residuos||[]).join(", ")+".");
    err(ERR_APR[j&&j.error]||("No se pudo completar ("+((j&&j.error)||"error")+")."));
  }catch(x){ err("Sin conexión con la hoja de Google. Inténtalo de nuevo."); }
  finally{ const b2=$("#a-ok"); if(b2){ b2.disabled=false; b2.textContent=modo==="aprobar"?"Aprobar":"Reabrir"; } }
}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const t=e.target;
  const tab=t.closest("[data-tab]"); if(tab){ TAB=tab.dataset.tab; if(TAB==="desp"){ if(!$("#d-fecha").value) $("#d-fecha").value=H?H.fecha:todayStr(); if(!$("#d-placa").value) $("#d-placa").value=H?H.placa:LS.get("pesaje.placa",""); dlDesp(); } showView(); return; }
  const pu=t.closest("[data-p]"); if(pu&&pu.parentElement.id==="n-puerta"){ selPuerta=pu.dataset.p; $$("#n-puerta button").forEach(b=>b.classList.toggle("on",b===pu)); return; }
  if(t.closest("#b-new")){ openNew(); if($("#n-card").classList.contains("open")) $("#n-card").scrollIntoView({behavior:"smooth",block:"start"}); return; }
  const np=t.closest("[data-newp]"); if(np){ const [p,f,pl]=np.dataset.newp.split("|"); selPuerta=p; $("#n-fecha").value=f; $("#n-placa").value=pl; if(!$("#n-resp").value) $("#n-resp").value=LS.get("pesaje.resp",""); drawHome(); openNew(true); startHoja(); return; }
  const gd=t.closest("[data-gdesp]"); if(gd){ const [f,pl]=gd.dataset.gdesp.split("|"); $("#d-fecha").value=f; $("#d-placa").value=pl; TAB="desp"; showView(); consultarDespacho(); return; }
  const dh=t.closest("[data-delh]"); if(dh){ const h=HOJAS.find(x=>x.id===dh.dataset.delh); if(h&&!(h.pesadas||[]).length&&confirm("¿Quitar la hoja vacía de "+h.puerta+" ("+h.placa+")?")){ HOJAS=HOJAS.filter(x=>x!==h); DB.del(h.id).then(()=>{ drawHojas(); toast("Hoja quitada."); }); } return; }
  const op=t.closest("[data-open]"); if(op){ openHoja(op.dataset.open); return; }
  const bk=t.closest("[data-b]"); if(bk){ OPENB=OPENB===bk.dataset.b?null:bk.dataset.b; drawHoja(); return; }
  const rk=t.closest("[data-k]"); if(rk){ openSheet(rk.dataset.k); return; }
  const tv=t.closest("[data-tv]"); if(tv){ TARA={t:"val",v:parseFloat(tv.dataset.tv)}; $("#f-otra").value=""; drawTaras(); drawPrev(); $("#f-bruto").focus(); return; }
  if(t.closest("[data-tn]")){ TARA={t:"none"}; $("#f-otra").value=""; drawTaras(); drawPrev(); $("#f-bruto").focus(); return; }
  if(t.closest("[data-tp]")){ TARA={t:"pend"}; $("#f-otra").value=""; drawTaras(); drawPrev(); $("#f-bruto").focus(); return; }
  const ed=t.closest("[data-edit]"); if(ed){ editPesada(ed.dataset.edit); return; }
  const dl=t.closest("[data-del]"); if(dl){ delPesada(dl.dataset.del,dl); return; }
  if(t.closest("#d-print")){ if(!(DSTATE&&DSTATE.estado==="Aprobado")) return toast("Solo se puede imprimir un despacho aprobado."); window.print(); return; }
  if(t.closest("#a-open")){ $("#a-box").classList.remove("hidden"); t.closest("#a-open").classList.add("hidden"); return; }
  if(t.closest("#a-cancel")){ $("#a-box").classList.add("hidden"); $("#a-open").classList.remove("hidden"); $("#a-clave").value=""; return; }
  if(t.closest("#a-ok")){ aprobarDesp(); return; }
});
$("#n-go").addEventListener("click",startHoja);
$("#b-back").addEventListener("click",()=>{ H=null; drawHome(); showView(); });
$("#b-close").addEventListener("click",cerrarOReabrir);
$("#q").addEventListener("input",()=>drawHoja());
$("#sh-x").addEventListener("click",closeSheet);
$("#f-add").addEventListener("click",addPesada);
$("#f-cancel").addEventListener("click",()=>{ resetForm(); drawSheet(); });
$("#f-bruto").addEventListener("input",drawPrev);
$("#f-uni").addEventListener("input",drawPrev);
$("#f-otra").addEventListener("input",()=>{ if($("#f-otra").value.trim()) TARA={t:"val",v:null}; drawTaras(); drawPrev(); });
$("#f-bruto").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); addPesada(); } });
$("#d-go").addEventListener("click",consultarDespacho);
$("#n-placa").addEventListener("input",e=>{ e.target.value=e.target.value.toUpperCase(); });
$("#d-fecha").addEventListener("change",dlDesp);
$("#d-placa").addEventListener("input",e=>{ e.target.value=e.target.value.toUpperCase(); });
$("#chip-q").addEventListener("click",()=>{ toast("Enviando pendientes…"); sync(); });
window.addEventListener("online",()=>{ drawNet(); sync(); cargaCatalogo(); });
window.addEventListener("offline",()=>{ drawNet(); ACS.forEach(a=>a.abort()); });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ drawNet(); sync(); } });
setInterval(()=>{ if(navigator.onLine && (HOJAS.some(dirty)||Object.keys(LS.get(DESPQ,{})).length)) sync(); },45000);

/* ---------- arranque ---------- */
(async function init(){
  HOJAS = await DB.all();
  HOJAS.forEach(h=>{ h.pesadas=h.pesadas||[]; });
  drawNet(); drawHome(); showView();
  if(navigator.onLine){ sync(); cargaCatalogo(); }
  if("serviceWorker" in navigator && location.protocol!=="file:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
